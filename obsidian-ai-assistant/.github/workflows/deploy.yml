name: Deploy

on:
  push:
    branches: [ dev, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          npm install -g serverless
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Set environment
        id: set-env
        run: |
          if [[ $GITHUB_REF == 'refs/heads/master' ]]; then
            echo "STAGE=prod" >> $GITHUB_ENV
          else
            echo "STAGE=dev" >> $GITHUB_ENV
          fi
      - name: Deploy to AWS
        run: |
          cd obsidian-ai-assistant
          serverless deploy --stage ${{ env.STAGE }}
      - name: Run post-deployment tests
        run: |
          cd obsidian-ai-assistant/tests
          python -m pytest integration/ --env ${{ env.STAGE }}
      - name: Notify deployment status
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: deployments
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Deployment to ${{ env.STAGE }}
          SLACK_MESSAGE: 'Deployment to ${{ env.STAGE }} ${{ job.status }}'
          SLACK_FOOTER: 'Obsidian AI Assistant' 